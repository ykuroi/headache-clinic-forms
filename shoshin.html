    function fmtV(v) { return v === null || v === undefined ? "−" : String(v); }
    function dotClass(c, i) {
      return i < c.m ? "mig" : i < c.ha ? "oth" : c.c === null ? "non" : i < c.ha + c.c ? "clr" : "unc";
    }
    function legendItems(c) {
      var L = [];
      if (c.m) L.push(["mig", "片頭痛 " + c.m + "日"]);
      if (c.other) L.push(["oth", "その他の頭痛 " + c.other + "日"]);
      if (c.c !== null) { L.push(["clr", "スッキリ " + c.c + "日"]); L.push(["unc", "スッキリしない " + (30 - c.ha - c.c) + "日"]); }
      else L.push(["non", "頭痛なし " + (30 - c.ha) + "日"]);
      return L;
    }
    function reportText(d) {
      var L = ["【頭痛外来 本日の成績表】" + d.date + (d.kind === "shoki" ? "（初診）" : "（再診）")];
      TILES.forEach(function (t) { L.push(t[1] + (t[2] && t[0].length === 3 ? "(" + t[2] + ")" : "") + "：" + fmtV(d[t[0]]) + " " + t[3]); });
      L.push("※この1ヶ月（30日）の記録です");

    }
    function rewardHtml() {
      var d = reportData(), cal = "";
      if (d.cal) {
        var dots = "";
        for (var i = 0; i < 30; i++) dots += '<span class="gm-rw-dot ' + dotClass(d.cal, i) + '"></span>';
        cal = '<div class="gm-rw-cal">' + dots + "</div>" +
          '<div class="gm-rw-legend">' + legendItems(d.cal).map(function (x) { return '<span><i class="gm-rw-dot ' + x[0] + '"></i>' + x[1] + "</span>"; }).join("") + "</div>";
      }
      var tiles = TILES.map(function (t) {
        return '<div class="gm-rp-tile gm-rp-' + t[0] + '"><div class="gm-rp-lab">' + t[1] + (t[2] ? "<small>" + t[2] + "</small>" : "") + "</div>" +
          '<div class="gm-rp-val">' + fmtV(d[t[0]]) + '</div><div class="gm-rp-unit">' + t[3] + "</div></div>";
      }).join("");
      return '<div class="gm-reward gm-report">' +
        '<div class="gm-rp-head"><div class="gm-rw-chara">' + CHARA_SVG + "</div>" +
        '<div><div class="gm-rp-title">本日の成績表</div><div class="gm-rp-date">' + d.date + (d.kind === "shoki" ? "　初診" : "　再診") + "</div></div></div>" +
        '<div class="gm-rw-sub">全 ' + total + " 問のアンケートにご協力いただき、ありがとうございました</div>" +
        '<div class="gm-rp-sec">この1ヶ月（30日）</div>' + cal +
        '<div class="gm-rp-grid">' + tiles + "</div>" +
        '<div class="gm-rw-note">📸 この枠をスクリーンショットで保存できます。診察のときに先生と一緒に見てみましょう</div>' +
        '<button type="button" class="gm-rp-save" id="gmRpSave">💾 結果を保存する</button>' +
        '<div class="gm-rp-more" id="gmRpMore" hidden>' +
        '<button type="button" data-act="img">🖼 画像を保存</button>' +
        '<button type="button" data-act="mail">✉️ メール</button>' +
        '<button type="button" data-act="line">💬 LINE</button>' +
        '<button type="button" data-act="copy">📋 コピー</button>' +
        "</div></div>";
    }
    // 成績表を画像（PNG）に描く
    function reportCanvas(d) {
      var W = 1080, H = 1420, cv = document.createElement("canvas");
      cv.width = W; cv.height = H;
      var g = cv.getContext("2d"), F = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif';
      function rr(x, y, w, h, r, fill, stroke) {
        g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
        if (fill) { g.fillStyle = fill; g.fill(); }
        if (stroke) { g.lineWidth = 6; g.strokeStyle = stroke; g.stroke(); }
      }
      function txt(t, x, y, size, color, weight, align) {
        g.font = (weight || 700) + " " + size + "px " + F; g.fillStyle = color; g.textAlign = align || "center"; g.textBaseline = "alphabetic"; g.fillText(t, x, y);
      }
      var bg = g.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#fffaf0"); bg.addColorStop(1, "#eef7f5");
      g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, H);
      rr(24, 24, W - 48, H - 48, 48, bg, "#f0ad4e");
      txt("本日の成績表", W / 2, 150, 76, "#e8734a", 900);
      txt(d.date + (d.kind === "shoki" ? "　初診" : "　再診"), W / 2, 220, 40, "#666666", 700);
      var y = 300;
      txt("この1ヶ月（30日）", W / 2, y, 40, "#333333", 800);
      if (d.cal) {
        var COL = { mig: "#e57373", oth: "#ffb74d", clr: "#81c784", unc: "#cfd8dc", non: "#a5d6a7" };
        var R = 30, gap = 18, x0 = (W - (10 * 2 * R + 9 * gap)) / 2;
        for (var i = 0; i < 30; i++) {
          g.beginPath(); g.arc(x0 + R + (i % 10) * (2 * R + gap), y + 50 + R + Math.floor(i / 10) * (2 * R + gap), R, 0, Math.PI * 2);
          g.fillStyle = COL[dotClass(d.cal, i)]; g.fill();
        }
        // 凡例：はみ出す場合は2行に分ける
        var lg = legendItems(d.cal), ly = y + 50 + 3 * (2 * R + gap) + 40, lines = [[]], lw = [0];
        g.font = "700 32px " + F;
        lg.forEach(function (x) {
          var w = 44 + g.measureText(x[1]).width;
          var cur = lines.length - 1;
          if (lines[cur].length && lw[cur] + 30 + w > W - 140) { lines.push([]); lw.push(0); cur++; }
          lw[cur] += (lines[cur].length ? 30 : 0) + w; lines[cur].push(x);
        });
        lines.forEach(function (row, li) {
          var lx = (W - lw[li]) / 2, yy = ly + li * 50;
          row.forEach(function (x) {
            g.beginPath(); g.arc(lx + 14, yy - 11, 14, 0, Math.PI * 2); g.fillStyle = COL[x[0]]; g.fill();
            txt(x[1], lx + 40, yy, 32, "#555555", 700, "left");
            g.font = "700 32px " + F;
            lx += 44 + g.measureText(x[1]).width + 30;
          });
        });
        y = ly + (lines.length - 1) * 50 + 40;
      } else y += 40;
      // タイル：上段3つ（日数）、下段2つ（質問票）
      var rows = [TILES.slice(0, 3), TILES.slice(3)], th = 270, pad = 70, tg = 24;
      rows.forEach(function (row, ri) {
        var tw = (W - 2 * pad - (row.length - 1) * tg) / row.length;
        row.forEach(function (t, k) {
          var x = pad + k * (tw + tg), yy = y + ri * (th + tg);
          rr(x, yy, tw, th, 28, "#ffffff", null);
          txt(t[1], x + tw / 2, yy + 58, t[1].length > 6 ? 32 : 38, "#555555", 800);
          if (t[2]) txt(t[2], x + tw / 2, yy + 100, 28, "#888888", 700);
          txt(fmtV(d[t[0]]), x + tw / 2, yy + 200, 96, "#1f6f78", 900);
          txt(t[3], x + tw / 2, yy + 248, 30, "#888888", 700);
        });

    }
    function toBlob(cv, cb) {
      if (cv.toBlob) cv.toBlob(function (b) { cb(b); }, "image/png");
      else { var u = cv.toDataURL("image/png"), bin = atob(u.split(",")[1]), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); cb(new Blob([arr], { type: "image/png" })); }
    }
    function fileName(d) { return "headache_report_" + (d.date || "").replace(/[^0-9]/g, "") + ".png"; }
    function saveImage(d) {
      toBlob(reportCanvas(d), function (b) {
        var u = URL.createObjectURL(b), a = document.createElement("a");
        a.href = u; a.download = fileName(d); document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1500);
      });
    }
    function copyText(t, btn) {
      function ok() { var o = btn.textContent; btn.textContent = "✅ コピーしました"; setTimeout(function () { btn.textContent = o; }, 1600); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { window.prompt("コピーしてください", t); });
      else window.prompt("コピーしてください", t);
    }
    function wireReport(card) {
      var save = card.querySelector("#gmRpSave"), more = card.querySelector("#gmRpMore");
      if (!save) return;
      save.addEventListener("click", function () {
        var d = reportData(), text = reportText(d);
        more.hidden = false;
        if (!navigator.share) return;   // 共有できない端末：下のボタン（画像・メール・LINE・コピー）から選ぶ
        toBlob(reportCanvas(d), function (b) {
          var f = null;
          try { f = new File([b], fileName(d), { type: "image/png" }); } catch (e) {}
          var data = f && navigator.canShare && navigator.canShare({ files: [f] }) ? { files: [f], title: "本日の成績表", text: text } : { title: "本日の成績表", text: text };
          navigator.share(data).catch(function () {});
        });
      });
      more.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var d = reportData(), text = reportText(d), act = b.getAttribute("data-act");
        if (act === "img") saveImage(d);
        else if (act === "mail") location.href = "mailto:?subject=" + encodeURIComponent("頭痛外来 本日の成績表 " + d.date) + "&body=" + encodeURIComponent(text);
        else if (act === "line") window.open("https://line.me/R/share?text=" + encodeURIComponent(text), "_blank");
        else if (act === "copy") copyText(text, b);
      });
    }
    var rs = document.getElementById("resultScreen");
    var shownOnce = false;
    if (rs && window.MutationObserver) {
      new MutationObserver(function () {
        hud.classList.toggle("gm-hide", rs.classList.contains("active"));
        if (!rs.classList.contains("active") || rs.querySelector(".gm-reward")) return;
        var wrap = document.createElement("div");
        wrap.innerHTML = rewardHtml();
        var card = wrap.firstChild;
        rs.insertBefore(card, rs.firstChild);
        wireReport(card);
        if (!shownOnce) {
          shownOnce = true;
          buzz([40, 50, 40, 50, 120]);
          if (!REDUCE && CAN_ANIMATE) {
            var w = window.innerWidth;
            [0, 250, 500].forEach(function (t, i) { setTimeout(function () { burst(w * (0.2 + i * 0.3), 160, 3); }, t); });
          }
        }
      }).observe(rs, { childList: true, attributes: true, attributeFilter: ["class"] });
    }
  })();
})();

<!-- ブログルーレット：結果画面で「ルーレットを回す」と頭痛外来ブログの記事が1本選ばれ、別タブで開ける。
     記事一覧は GitHub Pages の blog/articles.js を読む（読めないときは下の控えを使う）。新しい記事は articles.js に足すだけでよい。 -->
<style>
.hz-blog{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:18px 0 8px;text-align:center;border-top:4px solid var(--accent);}

.hz-blog .hz-bl-sub{font-size:.78rem;color:var(--muted);margin:0 0 12px;}
.hz-blog .hz-bl-win{position:relative;min-height:92px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#f6f4ee;border:2px dashed #d9d3c4;border-radius:12px;padding:10px 12px;overflow:hidden;}
.hz-blog .hz-bl-win.spin{border-style:solid;border-color:var(--accent);}
.hz-blog .hz-bl-win.done{border-style:solid;border-color:var(--primary);background:#eef6f5;animation:hz-bl-pop .4s ease;}

.hz-blog .hz-bl-no{font-size:.72rem;font-weight:700;color:var(--accent);}
.hz-blog .hz-bl-title{font-size:.95rem;font-weight:700;line-height:1.5;color:var(--text);}
.hz-blog .hz-bl-win.spin .hz-bl-title{filter:blur(.4px);opacity:.85;}
.hz-blog .hz-bl-btn{display:block;width:100%;margin-top:12px;border:none;border-radius:12px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;}
.hz-blog .hz-bl-btn:disabled{opacity:.6;}
.hz-blog .hz-bl-read{display:none;margin-top:10px;padding:12px;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;text-decoration:none;}
.hz-blog .hz-bl-read.show{display:block;}
.hz-blog .hz-bl-all{display:inline-block;margin-top:10px;font-size:.78rem;color:var(--primary);}
</style>
<script>
(function () {
  var BASE = "https://ykuroi.github.io/headache-clinic-forms/blog/";
  // 控え（articles.js が読めないとき用）
  var FALLBACK = [
    {no:1, title:"タバコの煙で頭痛が起こるのはなぜ？ 片頭痛とにおいの関係", file:"001.html"},
    {no:2, title:"「肩こりがあるから緊張型頭痛」と言われたけれど……本当にそうでしょうか？", file:"002.html"},
    {no:3, title:"ズキズキする頭痛が、肩こりを伴う重い頭痛に？「変容性片頭痛」という考え方", file:"003.html"},
    {no:4, title:"片頭痛には予防薬があることを知っていますか？", file:"004.html"},
    {no:5, title:"片頭痛は、いつまで続くのでしょうか？", file:"005.html"},
    {no:6, title:"片頭痛の予防薬は、いつまで続ければいいのでしょうか？", file:"006.html"},
    {no:7, title:"めまいが治らない。その原因は片頭痛かもしれません", file:"007.html"},
    {no:8, title:"片頭痛は頭痛だけではありません", file:"008.html"}
  ];
  try {

  function list() {

  }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function mount() {
    var rs = document.getElementById("resultScreen");

    if (!foot) return;

    box.innerHTML =
      '<h3>🎰 頭痛外来ブログ ルーレット</h3>' +
      '<p class="hz-bl-sub">診察までのあいだに、記事を1つ読んでみませんか？</p>' +
      '<div class="hz-bl-win"><div class="hz-bl-no"></div><div class="hz-bl-title">？ ？ ？</div></div>' +
      '<button type="button" class="hz-bl-btn">ルーレットを回す</button>' +
      '<a class="hz-bl-read" target="_blank" rel="noopener">この記事を読む ↗</a>' +
      '<a class="hz-bl-all" href="' + BASE + 'index.html" target="_blank" rel="noopener">記事の一覧を見る</a>';
    foot.parentNode.insertBefore(box, foot);
    var win = box.querySelector(".hz-bl-win"), no = box.querySelector(".hz-bl-no"),
        ttl = box.querySelector(".hz-bl-title"), btn = box.querySelector(".hz-bl-btn"),
        read = box.querySelector(".hz-bl-read");
    var last = -1;
    function show(x) { no.textContent = "第" + x.no + "回"; ttl.textContent = x.title; }
    btn.addEventListener("click", function () {
      var arts = list(), n = arts.length;
      if (!n) return;
      var pick = Math.floor(Math.random() * n);
      if (n > 1 && pick === last) pick = (pick + 1 + Math.floor(Math.random() * (n - 1))) % n;
      last = pick;
      btn.disabled = true; read.classList.remove("show");
      win.classList.remove("done"); win.classList.add("spin");
      // だんだん遅くなって、最後に pick で止まる
      var steps = 18 + Math.floor(Math.random() * 4), i = 0, k = pick - steps;
      (function tick() {
        show(arts[((k + i) % n + n) % n]);
        if (i >= steps) {
          win.classList.remove("spin"); void win.offsetWidth; win.classList.add("done");
          read.href = BASE + arts[pick].file;
          read.classList.add("show");
          btn.disabled = false; btn.textContent = "もう一回まわす";

  }

  if (rsEl && window.MutationObserver) new MutationObserver(mount).observe(rsEl, { childList: true });

</script>
