<!-- ===================================================================
     ゲーム風演出・解説（Q1 頭痛日数・Q2 誘因・Q3/Q4 痛みの強さ・Q5/Q10 豆知識・Q6 おくすり情報・質問票の1問ずつ化）
     - 入力が正しくなると右側の OK ボタンが押せるようになる
     - OK を押すとボタンが爆発し、次の入力（次の設問）へ進む
     - 回答データ・保存キー・必須チェックには一切手を入れていない（見た目と進み方だけ）
     - saishin.html の </body> 直前に貼り付けるだけで動く独立ブロック
     =================================================================== -->
<style>
.gm-wait{display:none !important;}
.gm-ok{
  margin-left:auto;flex:0 0 auto;
  min-width:64px;height:48px;padding:0 16px;
  border:none;border-radius:24px;
  font-size:1.05rem;font-weight:800;letter-spacing:0.05em;
  background:#d9d6cf;color:#fff;cursor:not-allowed;
  transition:background .2s, transform .2s, box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
}
.gm-ok.ready{
  background:linear-gradient(135deg,#ff9a5a,#e8734a 55%,#d4552a);
  cursor:pointer;
  box-shadow:0 4px 0 #b5441f, 0 6px 14px rgba(232,115,74,.45);
  animation:gm-ready-in .35s cubic-bezier(.3,1.6,.5,1), gm-glow 1.4s ease-in-out .35s infinite;
}
.gm-ok.ready:active{transform:translateY(3px);box-shadow:0 1px 0 #b5441f, 0 2px 6px rgba(232,115,74,.45);}
.gm-ok.gm-gone{visibility:hidden;pointer-events:none;}
/* OK付きの行：1行目に説明、2行目に「入力欄・日・OK（右端）」 */
.dt-row.gm-has-ok .dt-label{flex-basis:100%;}
@keyframes gm-ready-in{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes gm-glow{
  0%,100%{box-shadow:0 4px 0 #b5441f, 0 6px 14px rgba(232,115,74,.45), 0 0 0 0 rgba(232,115,74,.5);}
  50%{box-shadow:0 4px 0 #b5441f, 0 6px 14px rgba(232,115,74,.45), 0 0 0 10px rgba(232,115,74,0);}
}
/* 入力し終えたステップ */
.dt-step{position:relative;transition:border-color .3s, background .3s;}
.dt-step.gm-done{border-color:#27ae60;background:#f3fbf5;}
.dt-step.gm-done::after{
  content:"✓ OK!";position:absolute;top:8px;right:10px;
  font-size:.78rem;font-weight:800;color:#fff;background:#27ae60;
  padding:2px 9px;border-radius:10px;
  animation:gm-stamp .45s cubic-bezier(.3,1.8,.5,1);
}
@keyframes gm-stamp{0%{transform:scale(2.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
/* 次のステップが登場するとき */
.gm-enter{animation:gm-slide-in .5s cubic-bezier(.2,1.2,.4,1);}
@keyframes gm-slide-in{0%{transform:translateX(60px) scale(.92);opacity:0}100%{transform:none;opacity:1}}
/* 自動計算の数字がぴょこっと跳ねる */
.dt-auto.gm-bump{animation:gm-bump .4s cubic-bezier(.3,1.8,.5,1);}
@keyframes gm-bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:#e8734a}100%{transform:scale(1)}}
/* 選択肢を押したときのポップ */
.opt-btn.gm-pop{animation:gm-pop .3s cubic-bezier(.3,1.8,.5,1);}
@keyframes gm-pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
/* Q3・Q4 をひとまとまりに */
.gm-pair{border:2px solid #b9d9d5;border-radius:14px;padding:4px 12px 12px;margin:10px 0;background:#fbfdfc;}
.gm-pair .qblock:last-of-type{border-bottom:none;}
.gm-pair-cmp{font-size:.85rem;font-weight:700;text-align:center;padding:6px 8px;border-radius:10px;margin:4px 0 0;}
.gm-pair-cmp.ok{background:#e8f5e9;color:#1e8449;}
.gm-pair-cmp.ng{background:#fdecea;color:#c0392b;}
.gm-pair-cmp.wait{background:#f1f1f1;color:var(--muted);}
.gm-pair.gm-done{border-color:#27ae60;}
/* スライダーに連動して変わる顔（Q10） */
.gm-face{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 4px;}
.gm-face-emoji{font-size:4rem;line-height:1;display:inline-block;}
.gm-face-emoji.gm-face-pop{animation:gm-face-pop .4s cubic-bezier(.3,1.8,.5,1);}
@keyframes gm-face-pop{0%{transform:scale(.5) rotate(-15deg)}100%{transform:scale(1) rotate(0)}}
.gm-face-label{font-size:.95rem;font-weight:800;padding:2px 12px;border-radius:12px;}
.gm-face-sub{font-size:.75rem;color:var(--muted);}
.gm-hide{display:none !important;}
.gm-linked .presence-toggle{display:none;}  /* 使ったかどうかは Q6 の日数で決まるので「あり/使用なし」は出さない */
/* HIT-6・GAD-7・PHQ-9・MIBS-4 を1問ずつのカードに */
.gm-quiz .matrix-wrap{display:none;}
.gm-quiz-prog{display:flex;align-items:center;gap:8px;margin:6px 0 10px;}
.gm-quiz-count{font-size:.85rem;font-weight:800;color:var(--primary-dark);white-space:nowrap;}
.gm-quiz-dots{display:flex;gap:5px;flex-wrap:wrap;}
.gm-quiz-dots button{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;
  font-size:.68rem;font-weight:700;color:var(--muted);padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.gm-quiz-dots button.done{background:#27ae60;border-color:#27ae60;color:#fff;}
.gm-quiz-dots button.cur{border-color:#e8734a;color:#e8734a;transform:scale(1.15);}
.gm-qcard{border:2px solid #b9d9d5;border-radius:14px;padding:12px;background:#fbfdfc;}
.gm-qcard-q{font-weight:700;font-size:.98rem;line-height:1.55;margin-bottom:10px;}
.gm-qcard-q .gm-qno{display:inline-block;background:var(--primary);color:#fff;border-radius:10px;font-size:.72rem;padding:0 8px;margin-right:6px;vertical-align:2px;}
.gm-qcard-opts{display:flex;flex-direction:column;gap:7px;}
.gm-qcard-opts .opt-btn{width:100%;text-align:center;}
.gm-qcard .gm-okbar{position:static;margin-top:10px;}
.gm-optnote{flex:0 0 100%;font-size:.82rem;color:#b5651d;background:#fff4e0;border-radius:10px;padding:6px 10px;margin-top:-2px;}
/* Q2 の分類ステージ */
.gm-stage{flex:0 0 100%;display:flex;flex-wrap:wrap;gap:8px;position:relative;
  padding:10px;border:1px solid var(--border);border-radius:12px;background:#fbfaf7;transition:border-color .3s, background .3s;}
.gm-stage .opt-group{margin-top:0;}
.gm-stage .other-input{flex:0 0 100%;margin-top:0 !important;}
.gm-stage.gm-done{border-color:#27ae60;background:#f3fbf5;}
.gm-stage .gm-okbar{flex:0 0 100%;}
/* Q2 の OK バー（画面下に追従） */
.gm-okbar{
  position:sticky;bottom:88px;z-index:5;
  display:flex;align-items:center;gap:10px;justify-content:flex-end;
  margin-top:12px;padding:8px 8px 8px 14px;
  background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:30px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.gm-okbar .gm-okbar-msg{font-size:.82rem;color:var(--muted);flex:1;}
.gm-okbar.gm-cleared{border-color:#27ae60;background:#f3fbf5;}
.gm-okbar.gm-cleared .gm-okbar-msg{color:#1e8449;font-weight:700;}
/* 爆発パーツ */
.gm-p{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;will-change:transform,opacity;}
.gm-dot{border-radius:50%;}
.gm-ring{position:fixed;pointer-events:none;z-index:9998;border-radius:50%;border:4px solid #f0ad4e;}
.gm-flash{position:fixed;pointer-events:none;z-index:9998;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#ffe08a 35%,rgba(255,154,90,.6) 60%,rgba(255,154,90,0) 72%);}
/* クリア表示 */
.gm-banner{
  position:fixed;left:50%;top:42%;z-index:10000;pointer-events:none;
  transform:translate(-50%,-50%);
  font-size:2rem;font-weight:900;color:#fff;white-space:nowrap;
  padding:14px 28px;border-radius:20px;
  background:linear-gradient(135deg,#2f6f6b,#27ae60);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  text-shadow:0 2px 0 rgba(0,0,0,.2);
}
/* キャラクターの豆知識（吹き出し） */
.gm-tip{display:flex;align-items:flex-end;gap:8px;margin:6px 0 14px;}
.gm-tip-chara{flex:0 0 64px;width:64px;height:72px;}
.gm-tip-chara svg{width:100%;height:100%;display:block;}
.gm-tip-bubble{
  position:relative;flex:1;
  background:#fffaf0;border:2px solid #f0ad4e;border-radius:16px;
  padding:10px 12px;font-size:.88rem;line-height:1.6;color:var(--text);

@keyframes gm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.gm-tip-bubble.gm-open{animation:gm-bubble .45s cubic-bezier(.3,1.6,.5,1);}
@keyframes gm-bubble{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.gm-tip-chara.gm-talk svg{animation:gm-talk .5s ease-in-out 3;}
@keyframes gm-talk{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}

@media (prefers-reduced-motion: reduce){
  .gm-tip.gm-closed .gm-tip-chara svg,.gm-tip-chara.gm-talk svg,.gm-tip-bubble.gm-open,.gm-tip-q{animation:none;}

}

@media (prefers-reduced-motion: reduce){ .gm-info[open] .gm-info-body{animation:none;} }
@media (prefers-reduced-motion: reduce){
  .gm-ok.ready,.gm-enter,.dt-auto.gm-bump,.opt-btn.gm-pop,.dt-step.gm-done::after{animation:none;}
}
</style>
<script>
(function () {
  "use strict";
  var REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CAN_ANIMATE = !!(document.body.animate);
  var COLORS = ["#e8734a", "#f0ad4e", "#ffd54f", "#2f6f6b", "#27ae60", "#e74c3c", "#3498db", "#9b59b6"];
  var SHAPES = ["★", "✦", "●", "◆", "✨"];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function mk(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function headerOffset() {
    var h = document.querySelector("header.app-header");
    var fixed = h && /sticky|fixed/.test(getComputedStyle(h).position);
    return (fixed ? h.getBoundingClientRect().height : 0) + 12;
  }
  function scrollToEl(target) {
    if (!target) return;
    var y = target.getBoundingClientRect().top + window.pageYOffset - headerOffset();
    window.scrollTo({ top: Math.max(0, y), behavior: REDUCE ? "auto" : "smooth" });
  }
  function replayClass(node, cls) {
    node.classList.remove(cls);
    void node.offsetWidth;
    node.classList.add(cls);
  }

  /* 指定位置で火花を散らす。power: 1=小さなキラキラ / 2=爆発 */
  function burst(cx, cy, power) {
    if (REDUCE || !CAN_ANIMATE) return;
    var n = power > 1 ? 34 : 9;
    var dist = power > 1 ? [70, 190] : [24, 60];
    for (var i = 0; i < n; i++) {
      var useShape = Math.random() < 0.45;
      var p = mk("div", "gm-p" + (useShape ? "" : " gm-dot"), useShape ? SHAPES[(Math.random() * SHAPES.length) | 0] : null);
      var size = power > 1 ? rand(7, 15) : rand(4, 8);
      var color = COLORS[(Math.random() * COLORS.length) | 0];
      if (useShape) {
        p.style.fontSize = size * 1.6 + "px";
        p.style.color = color;
        p.style.lineHeight = "1";
      } else {
        p.style.width = p.style.height = size + "px";
        p.style.background = color;
      }
      document.body.appendChild(p);
      var ang = rand(0, Math.PI * 2);
      var d = rand(dist[0], dist[1]);
      var dx = Math.cos(ang) * d, dy = Math.sin(ang) * d;
      var start = "translate(" + (cx - size / 2) + "px," + (cy - size / 2) + "px)";
      var end = "translate(" + (cx + dx - size / 2) + "px," + (cy + dy + (power > 1 ? 40 : 10) - size / 2) + "px) rotate(" + rand(-360, 360) + "deg) scale(" + rand(0.2, 0.6) + ")";
      var a = p.animate(
        [{ transform: start + " scale(1)", opacity: 1 }, { transform: end, opacity: 0 }],
        { duration: rand(550, 950), easing: "cubic-bezier(.15,.8,.3,1)", fill: "forwards" }
      );
      a.onfinish = (function (el) { return function () { el.remove(); }; })(p);
    }
    if (power > 1) {
      var flash = mk("div", "gm-flash");
      flash.style.left = cx - 60 + "px"; flash.style.top = cy - 60 + "px";
      flash.style.width = flash.style.height = "120px";
      document.body.appendChild(flash);
      flash.animate([{ transform: "scale(.2)", opacity: 1 }, { transform: "scale(1.6)", opacity: 0 }],
        { duration: 380, easing: "ease-out", fill: "forwards" }).onfinish = function () { flash.remove(); };
      var ring = mk("div", "gm-ring");
      ring.style.left = cx - 40 + "px"; ring.style.top = cy - 40 + "px";
      ring.style.width = ring.style.height = "80px";
      document.body.appendChild(ring);
      ring.animate([{ transform: "scale(.3)", opacity: 1 }, { transform: "scale(2.8)", opacity: 0, borderWidth: "1px" }],
        { duration: 560, easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards" }).onfinish = function () { ring.remove(); };
      // 画面がぶるっと揺れる
      var main = document.querySelector("main");
      if (main) main.animate(
        [{ transform: "translate(0,0)" }, { transform: "translate(-5px,3px)" }, { transform: "translate(5px,-3px)" },
         { transform: "translate(-3px,-2px)" }, { transform: "translate(0,0)" }],
        { duration: 260, easing: "ease-out" });
    }
  }

  /* OK ボタンを爆発させ、終わったら done() */
  function explode(btn, done) {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    if (navigator.vibrate) { try { navigator.vibrate([25, 30, 50]); } catch (e) {} }
    burst(cx, cy, 2);
    if (REDUCE || !CAN_ANIMATE) {
      btn.classList.add("gm-gone");
      done();
      return;
    }
    btn.animate(
      [{ transform: "scale(1)", opacity: 1 }, { transform: "scale(1.5) rotate(8deg)", opacity: 1, offset: 0.35 },
       { transform: "scale(0) rotate(-30deg)", opacity: 0 }],
      { duration: 360, easing: "cubic-bezier(.4,0,.6,1)" }
    ).onfinish = function () {
      btn.classList.add("gm-gone");
      setTimeout(done, 120);
    };
  }

  /* 「Q1 クリア！」表示 → 終わったら done() */
  function banner(text, done) {
    var b = mk("div", "gm-banner", text);
    document.body.appendChild(b);
    if (REDUCE || !CAN_ANIMATE) {
      setTimeout(function () { b.remove(); done(); }, 600);
      return;
    }
    var r = b.getBoundingClientRect();
    b.animate(
      [{ transform: "translate(-50%,-50%) scale(0) rotate(-10deg)", opacity: 0 },
       { transform: "translate(-50%,-50%) scale(1.2) rotate(3deg)", opacity: 1, offset: 0.25 },
       { transform: "translate(-50%,-50%) scale(1) rotate(0)", opacity: 1, offset: 0.4 },
       { transform: "translate(-50%,-50%) scale(1)", opacity: 1, offset: 0.8 },
       { transform: "translate(-50%,-90%) scale(.9)", opacity: 0 }],
      { duration: 1150, easing: "ease-out", fill: "forwards" }
    ).onfinish = function () { b.remove(); };
    setTimeout(function () { burst(r.left + r.width / 2, r.top + r.height / 2, 2); }, 280);
    setTimeout(done, 900);
  }

  function makeOkButton() {
    var btn = mk("button", "gm-ok", "OK");
    btn.type = "button";
    btn.disabled = true;
    return btn;
  }
  function setReady(btn, ready) {
    if (btn.disabled === !ready) return;
    btn.disabled = !ready;
    btn.classList.toggle("ready", ready);
  }
  function nextVisibleQuestion(block) {
    var all = Array.prototype.slice.call(document.querySelectorAll("#qContainer .qblock"));
    for (var i = all.indexOf(block) + 1; i < all.length; i++) {
      if (!all[i].classList.contains("hidden")) return all[i];
    }
    return null;
  }

  /* ---------------- Q1：頭痛日数（ツリー入力） ---------------- */
  function setupDayTree(block) {
    var steps = Array.prototype.slice.call(block.querySelectorAll(".dt-step"));
    if (!steps.length) return;
    var inputs = steps.map(function (s) { return s.querySelector("input[data-dt]"); });
    var confirmed = steps.map(function () { return false; });
    var shown = steps.map(function () { return false; });
    var cleared = false;
    var btns = steps.map(function (s, i) {
      var btn = makeOkButton();
      inputs[i].parentNode.appendChild(btn);
      inputs[i].parentNode.classList.add("gm-has-ok");
      btn.addEventListener("click", function () {
        if (btn.disabled || confirmed[i]) return;
        confirmed[i] = true;
        inputs[i].blur();
        explode(btn, function () {
          refresh(true);
          var next = null;
          for (var k = i + 1; k < steps.length; k++) {
            if (isShown(k)) { next = k; break; }
          }
          if (next !== null) {
            scrollToEl(steps[next]);
            setTimeout(function () { try { inputs[next].focus({ preventScroll: true }); } catch (e) { inputs[next].focus(); } }, 350);
          } else if (allDone() && !cleared) {
            cleared = true;
            banner("🎉 Q1 クリア！", function () { scrollToEl(nextVisibleQuestion(block)); });
          }
        });
      });
      return btn;
    });

    function needed(i) { return !steps[i].classList.contains("hidden"); }
    function isShown(i) { return needed(i) && !steps[i].classList.contains("gm-wait"); }
    function valid(i) {
      var err = steps[i].querySelector(".dt-err");
      return inputs[i].value !== "" && !(err && err.classList.contains("show"));
    }
    function allDone() {
      for (var i = 0; i < steps.length; i++) if (needed(i) && !confirmed[i]) return false;
      return true;
    }
    function refresh(animateEntry) {
      var gate = true;
      for (var i = 0; i < steps.length; i++) {
        if (!valid(i)) confirmed[i] = false;
        if (needed(i)) steps[i].classList.toggle("gm-wait", !gate);
        else confirmed[i] = false;
        var now = isShown(i);
        if (now && !shown[i] && animateEntry && !REDUCE) replayClass(steps[i], "gm-enter");
        shown[i] = now;
        steps[i].classList.toggle("gm-done", confirmed[i]);
        btns[i].classList.toggle("gm-gone", confirmed[i]);
        setReady(btns[i], !confirmed[i] && valid(i));
        if (needed(i)) gate = gate && confirmed[i];
      }
      if (!allDone()) cleared = false;
    }

    // 自動計算欄の数字が変わったら跳ねさせる
    Array.prototype.forEach.call(block.querySelectorAll(".dt-auto"), function (out) {
      var last = out.textContent;
      new MutationObserver(function () {
        if (out.textContent !== last && out.textContent !== "–") replayClass(out, "gm-bump");
        last = out.textContent;
      }).observe(out, { childList: true, characterData: true, subtree: true });
    });
    inputs.forEach(function (inp) {
      inp.addEventListener("input", function () { refresh(true); });
      // キーボードの「完了/改行」でも OK を押したことにする
      inp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          var b = btns[inputs.indexOf(inp)];
          if (!b.disabled) b.click();
        }
      });
    });
    refresh(false);
  }

  /* ---------------- Q2：誘因（分類ごとに OK で進む） ----------------
   * 「生活リズム」「気持ち・ストレス」…の分類ごとにステージを作り、各ステージ右下の OK で次の分類へ。
   * 何も選ばずに OK ＝ その分類はあてはまるものなし。最後に「その他」の記入欄。
   * 「思い当たるものはない」の選択肢は廃止（全ステージ何も選ばない＝なし）。 */
  function setupStagedChecklist(block, label) {
    var opts = block.querySelector(".options");
    if (!opts) return;
    var stages = [];
    var cur = null;
    Array.prototype.slice.call(opts.children).forEach(function (child) {
      if (child.classList.contains("opt-group") || !cur) {
        cur = mk("div", "gm-stage");
        opts.insertBefore(cur, child);
        stages.push(cur);
      }
      cur.appendChild(child);
    });
    var other = block.querySelector(".other-input");
    if (other) {
      var os = mk("div", "gm-stage");
      os.appendChild(mk("div", "opt-group", "✏️ その他"));
      os.appendChild(other);
      opts.appendChild(os);
      stages.push(os);
    }
    var confirmed = stages.map(function () { return false; });
    var cleared = false;
    var bars = stages.map(function (st, i) {
      var bar = mk("div", "gm-okbar");
      var msg = mk("span", "gm-okbar-msg");
      var btn = makeOkButton();
      bar.appendChild(msg);
      bar.appendChild(btn);
      st.appendChild(bar);
      btn.addEventListener("click", function () {
        if (btn.disabled || confirmed[i]) return;
        confirmed[i] = true;
        if (other) other.blur();
        explode(btn, function () {
          refresh(true);
          if (i + 1 < stages.length) {
            scrollToEl(stages[i + 1]);
            if (stages[i + 1].contains(other)) setTimeout(function () { try { other.focus({ preventScroll: true }); } catch (e) {} }, 400);
          } else if (!cleared) {
            cleared = true;
            banner("🎉 " + label + " クリア！", function () { scrollToEl(nextVisibleQuestion(block)); });
          }
        });
      });
      return { bar: bar, msg: msg, btn: btn };
    });

    function stageHasAnswer(st) {
      if (st.querySelector(".opt-btn.selected")) return true;
      var o = st.querySelector(".other-input");
      return !!(o && o.value.trim());
    }
    function refresh(animateEntry) {
      var gate = true;
      stages.forEach(function (st, i) {
        var wasHidden = st.classList.contains("gm-wait");
        st.classList.toggle("gm-wait", !gate);
        if (wasHidden && gate && animateEntry && !REDUCE) replayClass(st, "gm-enter");
        st.classList.toggle("gm-done", confirmed[i]);
        var b = bars[i], has = stageHasAnswer(st);
        b.bar.classList.toggle("gm-cleared", confirmed[i]);
        b.btn.classList.toggle("gm-gone", confirmed[i]);
        b.msg.textContent = confirmed[i] ? (has ? "✓ OK！" : "✓ あてはまるものなし")
          : has ? "選び終わったら OK" : "なければ、そのまま OK";
        setReady(b.btn, !confirmed[i]);
        gate = gate && confirmed[i];
      });
    }
    block.addEventListener("click", function (ev) {
      var opt = ev.target.closest(".opt-btn");
      if (!opt) return;
      if (opt.classList.contains("selected")) {
        replayClass(opt, "gm-pop");
        var r = opt.getBoundingClientRect();
        burst(r.right - 18, r.top + r.height / 2, 1);
      }
      setTimeout(function () { refresh(false); }, 0);
    });
    block.addEventListener("input", function () { refresh(false); });
    if (other) other.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") { ev.preventDefault(); bars[bars.length - 1].btn.click(); }
    });
    refresh(false);
  }

  var dt = document.querySelector('#qContainer .qblock[data-code="DAYS"]');
  if (dt) setupDayTree(dt);
  var trig = document.querySelector('#qContainer .qblock[data-code="TRIGGER"]');
  if (trig) setupStagedChecklist(trig, "Q2");

  /* ---------------- Q3・Q4：痛みの強さ（ひとまとまり、Q3≧Q4 で OK） ---------------- */
  function setupPainPair(maxCode, meanCode, label) {
    var bMax = document.querySelector('#qContainer .qblock[data-code="' + maxCode + '"]');
    var bMean = document.querySelector('#qContainer .qblock[data-code="' + meanCode + '"]');
    if (!bMax || !bMean) return;
    var wrap = mk("div", "gm-pair");
    bMax.parentNode.insertBefore(wrap, bMax);
    wrap.appendChild(bMax);
    wrap.appendChild(bMean);
    var cmp = mk("div", "gm-pair-cmp");
    var bar = mk("div", "gm-okbar");
    var msg = mk("span", "gm-okbar-msg");
    var btn = makeOkButton();
    bar.appendChild(msg);
    bar.appendChild(btn);
    wrap.appendChild(cmp);
    wrap.appendChild(bar);
    var confirmed = false, cleared = false;
    function val(b) {
      var inp = b.querySelector(".slider-input");
      return inp && inp.getAttribute("data-touched") === "1" ? Number(inp.value) : null;
    }
    function refresh() {
      var mx = val(bMax), mn = val(bMean);
      var both = mx !== null && mn !== null;
      var ok = both && mx >= mn;
      if (!ok) { confirmed = false; cleared = false; }
      cmp.className = "gm-pair-cmp " + (!both ? "wait" : ok ? "ok" : "ng");
      cmp.textContent = !both ? "Q3 と Q4 の両方のボタンを動かしてください"
        : ok ? "一番ひどいとき " + mx + " ≧ 平均 " + mn + "　✓"
        : "平均（" + mn + "）が一番ひどいとき（" + mx + "）より大きくなっています。もう一度確認してください";
      wrap.classList.toggle("gm-done", confirmed);
      bar.classList.toggle("gm-cleared", confirmed);
      btn.classList.toggle("gm-gone", confirmed);
      msg.textContent = confirmed ? "✓ OK！" : ok ? "よければ OK を押してください" : "";
      setReady(btn, ok && !confirmed);
    }
    ["input", "change", "pointerup", "touchend"].forEach(function (ev) {
      wrap.addEventListener(ev, function () { setTimeout(refresh, 0); });
    });
    btn.addEventListener("click", function () {
      if (btn.disabled || confirmed) return;
      confirmed = true;
      explode(btn, function () {
        refresh();
        if (!cleared) {
          cleared = true;
          banner("🎉 " + label + " クリア！", function () { scrollToEl(nextVisibleQuestion(bMean)); });
        }
      });
    });
    refresh();
  }
  setupPainPair("Q3", "Q4", "Q3・Q4");

  // 治療満足度（Q14）の「副作用」行：0・10 の下に意味を追記
  (function () {
    var inp = document.querySelector('#qContainer input[data-code="SATIS_fukusayou"]');
    var row = inp && inp.closest(".slider-container").querySelector(".slider-labels-row");
    if (!row) return;
    var sp = row.children;
    if (sp.length < 3) return;
    sp[0].innerHTML = "0 不満<br><small>（副作用あり）</small>";
    sp[2].innerHTML = "10 満足<br><small>（副作用なし）</small>";
    sp[2].style.textAlign = "right";
  })();

  /* ---------------- 段階スライダーの両端に顔（Q3・Q4 と同じ見た目に） ---------------- */
  function faceEnds(code, left, right, hint) {
    var q = document.querySelector('#qContainer .qblock[data-code="' + code + '"]');
    var row = q && q.querySelector(".slider-labels-row");
    if (!row) return;
    function part(f) {
      return "<span class='slider-face-label'><span class='face-emoji'>" + f[0] + "</span><span class='face-text'>" + f[1] + "</span></span>";
    }
    row.innerHTML = part(left) + part(right);
    var sc = row.closest(".slider-container");
    if (hint && sc) {
      var h = mk("p", "slider-hint", hint);
      sc.parentNode.insertBefore(h, sc);
    }
  }
  // Q5（頭痛以外の症状）：「あり」を選んだあとのスライダー
  faceEnds("Q5", ["😄", "とてもよくなった"], ["😖", "明らかに悪くなった"], "ボタンを左右にスライドさせて回答してください");
  // Q7〜Q9（薬の効き目）
  ["Q7", "Q8", "Q9"].forEach(function (c) {
    faceEnds(c, ["😄", "とてもよく効く"], ["😖", "全然効かない"], "ボタンを左右にスライドさせて回答してください");
  });

  /* ---------------- 選択肢の下にひとことコメント ---------------- */
  function addOptionNote(code, value, text) {
    var o = document.querySelector('#qContainer .qblock[data-code="' + code + '"] .opt-btn[data-value="' + value + '"]');
    if (!o) return;
    o.parentNode.insertBefore(mk("div", "gm-optnote", text), o.nextSibling);

  // Q14（今後も続けたいか）
  addOptionNote("Q11", "中止したい", "💬 直接言いだしにくかったら、ここで選んでしまってね！");

  /* ---------------- 質問票（HIT-6 など）を1問ずつ：選んで OK → 次の問題 ----------------
   * 元の表（ラジオボタン）は隠して残し、カードで選んだ内容をそのまま表のラジオに反映する。
   * 上の丸い番号を押すと前の問題に戻れる。 */
  function setupQuiz(q) {
    var block = document.querySelector('#qContainer .qblock[data-code="' + q.code + '"]');
    if (!block) return;
    block.classList.add("gm-quiz");
    var name = q.title || q.code;
    function radio(r, ci) {
      return block.querySelector('input[name="' + q.code + "_" + r.code + '"][value="' + ci + '"]');
    }
    function chosen(r) {
      var c = block.querySelector('input[name="' + q.code + "_" + r.code + '"]:checked');
      return c ? Number(c.value) : null;
    }
    var prog = mk("div", "gm-quiz-prog");
    var count = mk("span", "gm-quiz-count");
    var dots = mk("div", "gm-quiz-dots");
    prog.appendChild(count);
    prog.appendChild(dots);
    var card = mk("div", "gm-qcard");
    var anchor = block.querySelector(".matrix-wrap");
    block.insertBefore(prog, anchor);
    block.insertBefore(card, anchor);
    var done = q.rows.map(function () { return false; });
    var cur = 0, cleared = false;

    function renderDots() {
      dots.innerHTML = "";
      q.rows.forEach(function (r, i) {
        var d = mk("button", (done[i] ? "done" : "") + (i === cur ? " cur" : ""), String(i + 1));
        d.type = "button";
        d.disabled = !(done[i] || i === cur || (i > 0 && done[i - 1]));
        d.addEventListener("click", function () { if (!d.disabled) show(i, true); });
        dots.appendChild(d);
      });
      var n = done.filter(Boolean).length;
      count.textContent = n === q.rows.length ? "✓ " + name + " ぜんぶ回答済み" : name + "　" + (cur + 1) + " / " + q.rows.length;
    }
    function show(i, animate) {
      cur = i;
      var r = q.rows[i];
      card.innerHTML = "";
      var qq = mk("div", "gm-qcard-q");
      qq.appendChild(mk("span", "gm-qno", "問" + r.code));
      qq.appendChild(document.createTextNode(r.text));
      card.appendChild(qq);
      var opts = mk("div", "gm-qcard-opts");
      var bar = mk("div", "gm-okbar");
      var msg = mk("span", "gm-okbar-msg");
      var btn = makeOkButton();
      q.columns.forEach(function (c, ci) {
        var o = mk("div", "opt-btn", String(c.label).replace(/\s*[\(（][^)）]*点[\)）]\s*$/, "").replace(/\n/g, ""));
        if (chosen(r) === ci) o.classList.add("selected");
        o.addEventListener("click", function () {
          Array.prototype.forEach.call(opts.children, function (x) { x.classList.remove("selected"); });
          o.classList.add("selected");
          replayClass(o, "gm-pop");
          var rd = radio(r, ci);
          if (rd) { rd.checked = true; rd.dispatchEvent(new Event("change", { bubbles: true })); }
          refreshBar();
        });
        opts.appendChild(o);
      });
      card.appendChild(opts);
      bar.appendChild(msg);
      bar.appendChild(btn);
      card.appendChild(bar);
      function refreshBar() {
        var has = chosen(r) !== null;
        msg.textContent = has ? (i + 1 < q.rows.length ? "OK で次の問題へ" : "OK で " + name + " おわり！") : "あてはまるものを選んでください";
        setReady(btn, has);
      }
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        done[i] = true;
        explode(btn, function () {
          var next = -1;
          for (var k = i + 1; k < q.rows.length; k++) if (!done[k]) { next = k; break; }
          if (next === -1) for (var k2 = 0; k2 < i; k2++) if (!done[k2]) { next = k2; break; }
          if (next !== -1) {
            show(next, true);
          } else {
            show(i, false);
            if (!cleared) {
              cleared = true;
              banner("🎉 " + name + " クリア！", function () { scrollToEl(nextVisibleQuestion(block)); });
            }
          }
        });
      });
      refreshBar();
      renderDots();
      if (animate && !REDUCE) replayClass(card, "gm-enter");
      if (animate) {
        var top = prog.getBoundingClientRect().top;
        if (top < 0 || top > window.innerHeight * 0.5) scrollToEl(prog);
      }
    }
    show(0, false);
  }
  if (window.SCHEMA_SAISHIN) {
    SCHEMA_SAISHIN.sections.forEach(function (sec) {
      sec.questions.forEach(function (q) { if (q.type === "matrix") setupQuiz(q); });
    });

  /* ---------------- Q6 の日数に応じて効き目の質問（Q7〜Q9）を出す ----------------
   * 1日以上 → その薬の効き目の質問が出る（「あり」を自動で選んでスライダーを表示）
   * 0日     → 質問は隠し、「使用なし」として記録
   * 未入力  → 質問は隠し、未回答のまま */
  function linkUsageToEffect(pairs) {
    pairs.forEach(function (pr) {
      var inp = document.querySelector('#qContainer input[data-code="' + pr[0] + '"]');
      var q = document.querySelector('#qContainer .qblock[data-code="' + pr[1] + '"]');
      if (!inp || !q) return;
      var btns = q.querySelectorAll(".presence-toggle .presence-btn");
      var btnHas = btns[0], btnNone = btns[1];
      var state = null;
      q.classList.add("gm-linked");
      function update() {
        var v = inp.value === "" ? null : Number(inp.value);
        var next = v === null || isNaN(v) ? "blank" : v > 0 ? "used" : "zero";
        if (next === state) return;
        var wasHidden = state !== "used";
        state = next;
        q.classList.toggle("gm-hide", next !== "used");
        if (next === "used") {
          if (btnHas && q.getAttribute("data-presence") !== "has") btnHas.click();
          if (wasHidden && !REDUCE) replayClass(q, "gm-enter");
        } else if (next === "zero") {
          if (btnNone && q.getAttribute("data-presence") !== "none") btnNone.click();
        } else {
          q.setAttribute("data-presence", "");
          Array.prototype.forEach.call(btns, function (b) { b.classList.remove("selected"); });
          var dw = q.querySelector(".degree-slider-wrap");
          if (dw) dw.classList.add("hidden");
          FE._onAnswerChanged();
        }
      }
      inp.addEventListener("input", update);
      update();
    });
  }
  linkUsageToEffect([["Q6_naru", "Q7"], ["Q6_trip", "Q8"], ["Q6_otc", "Q9"]]);

  /* ---------------- スライダーに連動して顔が変わる（Q10） ---------------- */
  function addFaceToSlider(code, faces) {
    var q = document.querySelector('#qContainer .qblock[data-code="' + code + '"]');
    var inp = q && q.querySelector(".slider-input");
    if (!inp) return;
    var box = mk("div", "gm-face");
    var emo = mk("span", "gm-face-emoji", "🤔");
    var lab = mk("span", "gm-face-label", "スライドしてね");
    var sub = mk("span", "gm-face-sub", "");
    box.appendChild(emo);
    box.appendChild(lab);
    box.appendChild(sub);
    var sc = inp.closest(".slider-container");
    sc.parentNode.insertBefore(box, sc.nextSibling);
    var last = null;
    function update() {
      if (inp.getAttribute("data-touched") !== "1") return;
      var f = faces[Number(inp.value)];
      if (!f) return;
      emo.textContent = f[0];
      lab.textContent = f[1];
      lab.style.background = f[2];
      lab.style.color = f[3];
      sub.textContent = f[4] || "";
      if (last !== inp.value) replayClass(emo, "gm-face-pop");
      last = inp.value;
    }
    ["input", "change", "pointerup"].forEach(function (ev) {
      inp.addEventListener(ev, function () { setTimeout(update, 0); });
    });
  }
  // [顔, 評定, 背景色, 文字色, ひとこと]（並びは Q10 の選択肢順）
  addFaceToSlider("Q10", [

  // キャラクター（または「タップしてね」）を押すと吹き出しが飛び出す。もう一度押すと閉じる。
  function addTip(afterCode, title, html, teaser) {
    var q = document.querySelector('#qContainer .qblock[data-code="' + afterCode + '"]');
    if (!q) return;
    var tip = mk("div", "gm-tip gm-closed");
    var chara = mk("button", "gm-tip-chara");
    chara.type = "button";
    chara.setAttribute("aria-label", title + "を見る");
    chara.innerHTML = CHARA_SVG;
    chara.appendChild(mk("span", "gm-tip-q", "?"));
    var tease = mk("div", "gm-tip-teaser", teaser || "タップしてね！ 💡");
    var bubble = mk("div", "gm-tip-bubble");
    bubble.appendChild(mk("div", "gm-tip-title", title));
    var text = mk("div", "gm-tip-text");
    text.innerHTML = html;
    bubble.appendChild(text);
    bubble.appendChild(mk("span", "gm-tip-close", "（キャラクターをタップでとじる）"));
    tip.appendChild(chara);
    tip.appendChild(tease);
    tip.appendChild(bubble);
    q.appendChild(tip);
    function toggle() {
      var opening = tip.classList.contains("gm-closed");
      tip.classList.toggle("gm-closed", !opening);
      chara.setAttribute("aria-expanded", opening ? "true" : "false");
      if (!opening) return;
      replayClass(chara, "gm-talk");
      replayClass(bubble, "gm-open");
      var r = chara.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 3, 1);
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    }
    chara.addEventListener("click", toggle);
    tease.addEventListener("click", toggle);
    bubble.addEventListener("click", toggle);
  }
